openapi: 3.0.3
info:
  title: Payment API qua Gateway
  version: '1.0.0'
  description: Tạo và xem bản ghi thanh toán. Dùng access token Keycloak qua Authorize.
servers:
  - url: /
    description: Gateway đang phục vụ Swagger UI
  - url: http://localhost:8222
    description: Gateway local khi mở spec bằng công cụ riêng
security:
  - bearerAuth: []
paths:
  /api/v1/payments:
    get:
      operationId: listPayments
      summary: Liệt kê bản ghi thanh toán
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Trang bản ghi thanh toán.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Page'
                          - type: object
                            properties:
                              content:
                                type: array
                                items:
                                  $ref: '#/components/schemas/Payment'
              example:
                data:
                  content:
                    - Id: 7
                      orderId: 42
                      amount: 7990000
                      paymentMethod: VISA
                      createDate: '2026-11-18T10:30:00'
                      lastModifiedDate: null
                  page_info:
                    number: 1
                    size: 20
                    number_of_elements: 1
                    total_elements: 1
                    total_pages: 1
                    is_first: true
                    is_last: true
                request_id: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createPayment
      summary: Tạo bản ghi thanh toán
      description: |
        Lưu Payment rồi gửi yêu cầu phát sự kiện xác nhận qua Kafka. HTTP 200
        xác nhận việc tạo bản ghi, chưa xác nhận thu tiền từ nhà cung cấp.
        Một orderId chỉ có một Payment. Khi tạo đơn qua Order, Order đã gọi tạo
        Payment cho đơn đó. Chỉ dùng thao tác này cho đơn chưa có bản ghi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentInput'
            example:
              amount: 7990000
              paymentMethod: VISA
              orderId: 42
              orderReference: DEMO-ORDER-001
              customer:
                id: '673e1eb210c3c0aaec9afe01'
                firstname: An
                lastname: Nguyễn
                email: an.nguyen@example.test
      responses:
        '200':
          description: Data chứa ID số nguyên của bản ghi vừa tạo.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: integer
                        format: int32
              example: {data: 7, request_id: null}
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      description: Trang bắt đầu từ 1.
      schema: {type: integer, format: int32, minimum: 1, default: 1}
    Size:
      name: size
      in: query
      description: Số phần tử trên một trang.
      schema: {type: integer, format: int32, minimum: 1, maximum: 100, default: 20}
  responses:
    Unauthorized:
      description: Gateway yêu cầu access token hợp lệ.
      headers:
        WWW-Authenticate:
          schema: {type: string}
          example: Bearer
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type: {type: string}
              title: {type: string}
              status: {type: integer}
              detail: {type: string}
              instance: {type: string}
    BadRequest:
      description: Tham số hoặc nội dung yêu cầu không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalError:
      description: Xử lý thất bại. Kiểm tra trạng thái tài nguyên trước khi gửi lại yêu cầu ghi.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    Envelope:
      type: object
      required: [data, request_id]
      properties:
        data: {}
        request_id: {type: string, nullable: true}
    Page:
      type: object
      required: [content, page_info]
      properties:
        content:
          type: array
          items: {}
        page_info:
          $ref: '#/components/schemas/PageInfo'
    PageInfo:
      type: object
      required: [number, size, number_of_elements, total_elements, total_pages, is_first, is_last]
      properties:
        number: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1, maximum: 100}
        number_of_elements: {type: integer, minimum: 0}
        total_elements: {type: integer, format: int64, minimum: 0}
        total_pages: {type: integer, minimum: 0}
        is_first: {type: boolean}
        is_last: {type: boolean}
    ApiError:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [error_code, extra_data]
              properties:
                error_code: {type: string}
                extra_data:
                  type: object
                  required: [message]
                  properties:
                    message: {type: string}
                    errors:
                      type: object
                      additionalProperties: {type: string}
                    details: {}
    PaymentMethod:
      type: string
      enum: [PAYPAL, CREDIT_CARD, VISA, MASTER_CARD, BITCOIN]
    PaymentInput:
      type: object
      required: [amount, paymentMethod, orderId, customer]
      properties:
        id: {type: integer, format: int32, nullable: true, description: Bỏ qua khi tạo bản ghi mới.}
        amount: {type: number, description: Số tiền ghi nhận.}
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        orderId: {type: integer, format: int32}
        orderReference:
          type: string
          nullable: true
          description: Mã tham chiếu đơn gửi trong sự kiện xác nhận.
        customer:
          $ref: '#/components/schemas/PaymentCustomer'
    PaymentCustomer:
      type: object
      description: Hồ sơ khách hàng dùng cho sự kiện xác nhận.
      properties:
        id: {type: string, nullable: true}
        firstname: {type: string, nullable: true}
        lastname: {type: string, nullable: true}
        email: {type: string, nullable: true}
    Payment:
      type: object
      required: [Id, orderId, amount, paymentMethod, createDate, lastModifiedDate]
      properties:
        Id: {type: integer, format: int32, description: ID bản ghi. Tên trường JSON viết hoa chữ I.}
        orderId: {type: integer, format: int32}
        amount: {type: number}
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        createDate: {type: string, description: Ngày giờ địa phương ISO 8601.}
        lastModifiedDate: {type: string, nullable: true, description: Ngày giờ địa phương ISO 8601.}
