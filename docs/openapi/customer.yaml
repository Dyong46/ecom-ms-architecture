openapi: 3.0.3
info:
  title: Customer API qua Gateway
  version: '1.0.0'
  description: Quản lý hồ sơ và địa chỉ khách hàng. Dùng access token Keycloak qua Authorize.
servers:
  - url: /
    description: Gateway đang phục vụ Swagger UI
  - url: http://localhost:8222
    description: Gateway local khi mở spec bằng công cụ riêng
security:
  - bearerAuth: []
paths:
  /api/v1/customers:
    get:
      operationId: listCustomers
      summary: Liệt kê khách hàng
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Trang khách hàng. Trang ngoài phạm vi trả về mảng content rỗng.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Page'
                          - type: object
                            properties:
                              content:
                                type: array
                                items:
                                  $ref: '#/components/schemas/Customer'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createCustomer
      summary: Tạo hồ sơ khách hàng
      description: Có thể bỏ id để kho dữ liệu cấp ID cho hồ sơ mới.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
            example:
              firstname: An
              lastname: Nguyễn
              email: an.nguyen@example.test
              address: {street: Nguyễn Huệ, houseNumber: '25', zipCode: '700000'}
      responses:
        '200':
          description: Data chứa ID của khách hàng.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: string
              example: {data: '673e1eb210c3c0aaec9afe01', request_id: null}
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: updateCustomer
      summary: Cập nhật khách hàng theo ID trong body
      description: Gửi id của hồ sơ cần sửa cùng tên, email và địa chỉ. Địa chỉ được thay toàn bộ.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CustomerInput'
                - type: object
                  required: [id]
                  properties:
                    id: {type: string}
            example:
              id: '673e1eb210c3c0aaec9afe01'
              firstname: An
              lastname: Nguyễn
              email: an.nguyen@example.test
              address: {street: Lê Lợi, houseNumber: '18', zipCode: '700000'}
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/customers/exits/{customerId}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      operationId: customerExists
      summary: Kiểm tra ID khách hàng có tồn tại
      description: Đường dẫn hiện tại dùng đoạn exits. Trả data false nếu ID không tồn tại.
      responses:
        '200':
          description: Kết quả kiểm tra dưới dạng boolean.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: boolean
              example: {data: false, request_id: null}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/customers/{customerId}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      operationId: getCustomer
      summary: Xem chi tiết khách hàng
      responses:
        '200':
          description: Hồ sơ và địa chỉ của khách hàng.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Customer'
              example:
                data:
                  id: '673e1eb210c3c0aaec9afe01'
                  firstname: An
                  lastname: Nguyễn
                  email: an.nguyen@example.test
                  address: {street: Nguyễn Huệ, houseNumber: '25', zipCode: '700000'}
                request_id: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteCustomer
      summary: Xóa hồ sơ khách hàng
      responses:
        '202':
          $ref: '#/components/responses/Accepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      description: Trang bắt đầu từ 1.
      schema: {type: integer, format: int32, minimum: 1, default: 1}
    Size:
      name: size
      in: query
      description: Số phần tử trên một trang.
      schema: {type: integer, format: int32, minimum: 1, maximum: 100, default: 20}
    CustomerId:
      name: customerId
      in: path
      required: true
      schema: {type: string}
  responses:
    Unauthorized:
      description: Gateway yêu cầu access token hợp lệ.
      headers:
        WWW-Authenticate:
          schema: {type: string}
          example: Bearer
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type: {type: string}
              title: {type: string}
              status: {type: integer}
              detail: {type: string}
              instance: {type: string}
    BadRequest:
      description: Tham số hoặc nội dung yêu cầu không hợp lệ.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Không tìm thấy tài nguyên theo ID.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Email đã được sử dụng trong một hồ sơ khác (kể cả hồ sơ đánh dấu đã xóa). So sánh theo giá trị lưu, có phân biệt hoa/thường.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Accepted:
      description: Phản hồi xác nhận cập nhật hoặc xóa.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data:
                    type: object
                    nullable: true
          example: {data: null, request_id: null}
  schemas:
    Envelope:
      type: object
      required: [data, request_id]
      properties:
        data: {}
        request_id: {type: string, nullable: true}
    Page:
      type: object
      required: [content, page_info]
      properties:
        content:
          type: array
          items: {}
        page_info:
          $ref: '#/components/schemas/PageInfo'
    PageInfo:
      type: object
      required: [number, size, number_of_elements, total_elements, total_pages, is_first, is_last]
      properties:
        number: {type: integer, minimum: 1}
        size: {type: integer, minimum: 1, maximum: 100}
        number_of_elements: {type: integer, minimum: 0}
        total_elements: {type: integer, format: int64, minimum: 0}
        total_pages: {type: integer, minimum: 0}
        is_first: {type: boolean}
        is_last: {type: boolean}
    ApiError:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              required: [error_code, extra_data]
              properties:
                error_code: {type: string}
                extra_data:
                  type: object
                  required: [message]
                  properties:
                    message: {type: string}
                    errors:
                      type: object
                      additionalProperties: {type: string}
                    details: {}
    Address:
      type: object
      properties:
        street: {type: string, nullable: true}
        houseNumber: {type: string, nullable: true}
        zipCode: {type: string, nullable: true}
    CustomerInput:
      type: object
      required: [firstname, lastname, email, address]
      properties:
        id: {type: string, nullable: true}
        firstname: {type: string}
        lastname: {type: string}
        email: {type: string, format: email}
        address:
          $ref: '#/components/schemas/Address'
    Customer:
      allOf:
        - $ref: '#/components/schemas/CustomerInput'
        - type: object
          required: [id]
          properties:
            id: {type: string}
