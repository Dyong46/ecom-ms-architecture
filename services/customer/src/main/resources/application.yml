spring:
  config:
    # optional mean that if config false, use default config
    import: optional:configserver:http://localhost:8888
  application:
    name: customer-service

mongock:
  migration-scan-package:
    - com.duong.ecommerce.customer.migration
  runner-type: initializingbean
  # Local MongoDB is standalone; this baseline only creates an index.
  transactional: false
