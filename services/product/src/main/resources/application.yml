spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:9098/realms/micro-services}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:9098/realms/micro-services/protocol/openid-connect/certs}
  config:
    import: optional:configserver:http://localhost:8888
  application:
    name: product-service
