server:
  port: 8060

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${PAYMENT_OAUTH_ISSUER_URI:http://localhost:9098/realms/micro-services}
          jwk-set-uri: ${PAYMENT_OAUTH_JWK_SET_URI:http://localhost:9098/realms/micro-services/protocol/openid-connect/certs}
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/payment
    username: payment_user
    password: payment_password
  jpa:
    hibernate:
      ddl-auto: validate
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
  kafka:
    producer:
      properties:
        spring.json.type.mapping: paymentConfirmation:com.duong.ecommerce.payment.payload.event.PaymentNotificationRequest

application:
  config:
    product-url: http://localhost:8222/api/v1/products

# Only this Keycloak client may call the protected internal payment endpoint.
payment:
  security:
    allowed-client-id: ${ECOM_OAUTH_CLIENT_ID:ecom-services}

kafka-module:
  topics:
    - name: ${application.events.payment-topic}
      partitions: 1
      replicas: 1
