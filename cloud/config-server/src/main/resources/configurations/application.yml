eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      auto-create: ${KAFKA_PROVISION_TOPICS:false}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        allow.auto.create.topics: false
    listener:
      ack-mode: record
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:1}
      observation-enabled: true
    template:
      observation-enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2s
      timeout: 2s
  cloud:
    config:
      override-system-properties: false

# Shared identity for Ecom OAuth integrations. Only opt-in EcomAuthClient consumers
# require these credentials. Order uses them for the protected Payment client.
integration-config:
  ecom:
    oauth-base-url: ${ECOM_OAUTH_BASE_URL:http://localhost:9098}
    oauth-realm: ${ECOM_OAUTH_REALM:micro-services}
    oauth-username: ${ECOM_OAUTH_CLIENT_ID:ecom-services}
    oauth-password: ${ECOM_OAUTH_CLIENT_SECRET:}

application:
  events:
    order-topic: ${KAFKA_ORDER_TOPIC:order-topic}
    payment-topic: ${KAFKA_PAYMENT_TOPIC:payment-topic}
  config:
    customer-url: ${CUSTOMER_SERVICE_URL:http://localhost:8090/internal/customers}
    product-url: ${PRODUCT_SERVICE_URL:http://localhost:8050/internal/products}
    payment-url: ${PAYMENT_SERVICE_URL:http://localhost:8060/internal/payments}

proxy:
  http:
    connect-timeout: ${PROXY_CONNECT_TIMEOUT:2s}
    read-timeout: ${PROXY_READ_TIMEOUT:5s}

management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

# Used only by applications opting in with @EnableCachingModule.
caching-config:
  namespace: ${CACHE_NAMESPACE:ecom}
  environment: ${APP_ENV:local}
  default-ttl: ${CACHE_DEFAULT_TTL:5m}
  memory-max-size: ${CACHE_MEMORY_MAX_SIZE:1000}

# Enable topic creation only for a controlled local/bootstrap run.
kafka-module:
  provision-topics: ${KAFKA_PROVISION_TOPICS:false}
