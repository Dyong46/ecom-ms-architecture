spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:9098/realms/micro-services}
  application:
    name: api-gateway
  config:
    import:
      - configserver:http://localhost:8888
      - optional:file:./cloud/api-gateway/.env.properties

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
