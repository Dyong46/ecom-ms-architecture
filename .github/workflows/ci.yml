name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - support/common-module
          - support/web-module
          - support/common-data-model
          - cloud/config-server
          - services/discovery
          - services/customer
          - services/product
          - services/order
          - services/payment
          - services/notification
          - cloud/api-gateway

    defaults:
      run:
        working-directory: ${{ matrix.module }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: |
            pom.xml
            services/pom.xml
            cloud/pom.xml
            support/pom.xml
            support/common-module/pom.xml
            support/web-module/pom.xml
            support/common-data-model/pom.xml
            ${{ matrix.module }}/pom.xml

      - name: Run tests
        run: $GITHUB_WORKSPACE/services/product/mvnw -f ../../pom.xml -pl ${{ matrix.module }} -am --batch-mode verify
