apiVersion: 1

datasources:
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: TraceID
          datasourceUid: zipkin
          matcherRegex: '"traceId"\s*:\s*"([0-9a-fA-F]{16,32})"'
          url: '$${__value.raw}'
          urlDisplayLabel: View trace
